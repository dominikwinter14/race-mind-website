<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaceMind &ndash; 7 Tage kostenlos</title>
  <meta name="description" content="Dein digitaler Coach f&uuml;r Triathlon und Laufen. Plan, Analyse und Antworten &ndash; 7 Tage kostenlos, ohne Zahlungsdaten.">

  <!-- Ad landing page: must not compete with the homepage in search results,
       and must not be indexed under half a dozen ?v= variants. -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../fonts.css">

  <script>
    // The hero shot differs per ?v= variant and it is the LCP element. A
    // static <link rel=preload> would either fetch the wrong file or make the
    // other variant download two. Deciding here — before the parser reaches
    // <body> — starts exactly one fetch, at the earliest possible moment.
    //
    // HERO_BY_VARIANT must stay in sync with VARIANTS[x].heroImg further down;
    // the check in _scripts/verify-lander.js fails the build if it drifts.
    (function () {
      var HERO_BY_VARIANT = {
        triathlon: '../images/mockup-hero.webp',
        marathon: '../images/hero-dash-marathon.webp',
        halbmarathon: '../images/hero-dash-halbmarathon.webp',
        coach: '../images/hero-coachchat.webp'
      };
      var DEFAULT_VARIANT = 'triathlon';
      var v = (new URLSearchParams(location.search).get('v') || '').toLowerCase();
      var href = HERO_BY_VARIANT[v] || HERO_BY_VARIANT[DEFAULT_VARIANT];

      window.__heroImg = href;
      var l = document.createElement('link');
      l.rel = 'preload';
      l.as = 'image';
      l.href = href;
      l.setAttribute('fetchpriority', 'high');
      document.head.appendChild(l);
    })();
  </script>

  <style>
    /* ══════════════════════════════════════════════════════════════
       Self-contained on purpose. The main style.css is 3.3k lines;
       a paid-traffic lander pays for every one of them in LCP on a
       mobile connection. Tokens mirror style.css / constants/colors.ts.
       ══════════════════════════════════════════════════════════════ */

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #FF8A00;
      --primary-dark: #FF6B00;
      --secondary: #00D1FF;
      --bg: #050505;
      --surface: #111111;
      --card: #1A1C1E;
      --muted: #949494;
      --foreground: #FFFFFF;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 1rem;
      --container: 1120px;
    }

    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    body {
      font-family: 'Lexend Deca', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* height:auto is not optional here: the width/height attributes below are
       layout hints, and without it the browser applies the height literally —
       every phone mockup rendered 4–8 % too tall. */
    img { max-width: 100%; height: auto; display: block; }

    .container {
      width: 100%;
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 1rem;
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ─────────── Header: logo only. No nav — an ad lander has one exit. ─────────── */

    .topbar {
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .topbar-logo { height: 26px; width: auto; }

    .topbar-trust {
      font-size: 0.72rem;
      font-weight: 300;
      color: var(--muted);
      text-align: right;
    }

    /* ─────────── Hero ─────────── */

    .hero {
      position: relative;
      padding: 3rem 0 3.5rem;
      overflow: hidden;
    }

    .hero-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.16;
      pointer-events: none;
      z-index: 0;
    }

    .hero-glow--orange {
      width: 480px; height: 480px;
      background: var(--primary);
      top: -180px; left: -140px;
    }

    .hero-glow--cyan {
      width: 420px; height: 420px;
      background: var(--secondary);
      top: 80px; right: -180px;
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.5rem;
      align-items: center;
    }

    .hero-eyebrow {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      border: 1px solid rgba(255, 138, 0, 0.3);
      background: rgba(255, 138, 0, 0.08);
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      margin-bottom: 1.25rem;
      /* min-width is set at runtime from the widest rotating label, so the
         chip does not resize on every swap. */
      text-align: center;
    }

    #heroEyebrowText {
      display: inline-block;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #heroEyebrowText.is-out { opacity: 0; transform: translateY(-4px); }

    @media (prefers-reduced-motion: reduce) {
      #heroEyebrowText { transition: none; }
    }

    /* Scope line — who this is actually for. The homepage carries the same
       statement above the fold; a lander that drops it makes every visitor
       guess whether their distance is covered. */
    .hero-scope {
      font-size: 0.84rem;
      font-weight: 300;
      color: var(--muted);
      margin: -0.9rem 0 1.6rem;
    }

    .hero-scope strong { color: rgba(255, 255, 255, 0.8); font-weight: 500; }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    h1 {
      font-size: clamp(1.9rem, 6.5vw, 3.1rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    /* Ticked-off marker in the headline. An SVG, not the ✅ emoji: that glyph
       is green (a third colour next to the orange/cyan gradient it sits in),
       and it renders differently on every platform. */
    .h1-check {
      display: inline-block;
      width: 0.78em;
      height: 0.78em;
      vertical-align: 0.02em;
      margin-left: 0.16em;
      color: var(--primary);
      flex-shrink: 0;
    }

    .h1-check svg { width: 100%; height: 100%; display: block; }

    .hero-sub {
      font-size: clamp(0.98rem, 2.6vw, 1.1rem);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.78);
      margin-bottom: 1.75rem;
      max-width: 34em;
    }

    /* ─────────── CTA ─────────── */

    .cta-block { max-width: 27rem; }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 1.05rem 1.5rem;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #0A0A0A;
      font-family: inherit;
      font-size: 1.02rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 10px 34px rgba(255, 138, 0, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cta:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(255, 138, 0, 0.36); }
    .cta:active { transform: translateY(0); }
    .cta-icon { width: 20px; height: 20px; flex-shrink: 0; }

    /* Secondary store link for the OS we did not detect. Deliberately quiet:
       the whole point of detection is that there is one obvious button. */
    .cta-alt {
      display: block;
      margin-top: 0.7rem;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--muted);
      text-decoration: none;
    }

    .cta-alt u { text-decoration-color: rgba(255, 255, 255, 0.25); text-underline-offset: 3px; }
    .cta-alt:hover { color: var(--foreground); }

    .cta-reassure {
      margin-top: 0.85rem;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.62);
    }

    .cta-reassure strong { color: var(--foreground); font-weight: 600; }

    /* ─────────── Rating row ─────────── */

    .rating {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .rating-stars { color: var(--primary); font-size: 0.95rem; letter-spacing: 0.06em; }

    .rating-text { font-size: 0.8rem; font-weight: 300; color: var(--muted); }

    /* ─────────── Hero shot ─────────── */

    .hero-shot {
      position: relative;
      justify-self: center;
      max-width: 300px;
      width: 100%;
    }

    .hero-shot img { border-radius: 1.5rem; }

    /* ─────────── Compat strip ─────────── */

    .compat {
      padding: 1.75rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .compat-label {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.1rem;
    }

    .compat-logos {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.5rem 2.25rem;
    }

    /* Same treatment as style.css:483 — the source logos are a mix of white
       (Garmin), near-black (Suunto #231F20) and brand orange (Strava). Only
       brightness(0) invert(1) flattens all three to the same white. */
    .compat-logos img {
      height: 22px;
      width: auto;
      opacity: 0.55;
      filter: brightness(0) invert(1);
    }

    /* ─────────── Sections ─────────── */

    .section { padding: 3.5rem 0; }
    .section--alt { background: var(--surface); }

    .split {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: center;
    }

    h2 {
      font-size: clamp(1.5rem, 4.5vw, 2.1rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.015em;
      margin-bottom: 0.9rem;
    }

    .lead {
      font-size: 0.98rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.74);
      margin-bottom: 1.5rem;
    }

    .lead strong { color: var(--foreground); font-weight: 500; }

    .bullets { list-style: none; display: flex; flex-direction: column; gap: 0.9rem; }

    .bullets li {
      position: relative;
      padding-left: 1.75rem;
      font-size: 0.92rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.78);
    }

    .bullets li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
    }

    .bullets strong { color: var(--foreground); font-weight: 600; }

    .shot { justify-self: center; max-width: 280px; width: 100%; }
    .shot img { border-radius: 1.5rem; }

    /* ─────────── Feature grid ─────────── */

    .features {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
    }

    .feature {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .feature-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 138, 0, 0.1);
      border: 1px solid rgba(255, 138, 0, 0.22);
      color: var(--primary);
    }

    .feature-icon svg { width: 19px; height: 19px; }

    .feature h3 { font-size: 0.98rem; font-weight: 600; line-height: 1.35; }

    .feature p {
      font-size: 0.85rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.55;
    }

    .features-more {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.6;
    }

    .features-more strong { color: rgba(255, 255, 255, 0.85); font-weight: 500; }

    /* ─────────── Reviews ─────────── */

    .section-head { text-align: center; margin-bottom: 2rem; }
    .section-head h2 { margin-bottom: 0.5rem; }
    .section-head p { font-size: 0.9rem; font-weight: 300; color: var(--muted); }

    .reviews {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .review {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .review-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .review-stars { color: var(--primary); font-size: 0.82rem; letter-spacing: 0.05em; }

    .review-source {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.68rem;
      font-weight: 400;
      color: var(--muted);
    }

    .review-source svg { width: 13px; height: 13px; }

    .review-text {
      font-size: 0.87rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.6;
      flex: 1;
    }

    .review-meta { display: flex; align-items: center; gap: 0.55rem; }

    .review-avatar {
      width: 26px; height: 26px;
      flex-shrink: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #0A0A0A;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .review-name { font-size: 0.78rem; font-weight: 500; }

    /* ─────────── Price anchor ─────────── */

    .anchor {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      max-width: 52rem;
      margin: 0 auto;
    }

    .anchor-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem;
      text-align: center;
    }

    .anchor-item--hl {
      border-color: rgba(255, 138, 0, 0.45);
      background: rgba(255, 138, 0, 0.06);
    }

    .anchor-what { font-size: 0.8rem; font-weight: 300; color: var(--muted); margin-bottom: 0.3rem; }
    .anchor-price { font-size: 1.15rem; font-weight: 700; }
    .anchor-item--hl .anchor-price { color: var(--primary); }

    .anchor-note {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8rem;
      font-weight: 300;
      color: var(--muted);
    }

    /* ─────────── Closing CTA ─────────── */

    .close { position: relative; text-align: center; overflow: hidden; }
    .close .container { position: relative; z-index: 1; }
    .close .cta-block { margin: 0 auto; }
    .close h2 { margin-bottom: 0.75rem; }
    .close .lead { margin-left: auto; margin-right: auto; max-width: 32em; }

    /* ─────────── Footer ─────────── */

    .footer {
      padding: 2rem 0 6.5rem;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem;
      margin-bottom: 0.85rem;
    }

    .footer-links a {
      font-size: 0.8rem;
      font-weight: 300;
      color: var(--muted);
      text-decoration: none;
    }

    .footer-links a:hover { color: var(--foreground); }
    .footer-copy { font-size: 0.72rem; font-weight: 300; color: rgba(255, 255, 255, 0.35); }

    /* ─────────── Sticky mobile CTA ─────────── */

    .sticky {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 40;
      padding: 0.7rem 1rem calc(0.7rem + env(safe-area-inset-bottom));
      background: rgba(5, 5, 5, 0.92);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      transform: translateY(110%);
      transition: transform 0.25s ease;
    }

    .sticky.is-visible { transform: translateY(0); }

    /* Both live at the bottom edge. The consent dialog wins until it is
       answered, otherwise they stack on top of each other on mobile. */
    body.consent-open .sticky { transform: translateY(110%); }

    .sticky .cta { padding: 0.9rem 1.25rem; font-size: 0.95rem; box-shadow: none; }
    .sticky .cta:hover { transform: none; }

    .sticky-note {
      text-align: center;
      margin-top: 0.4rem;
      font-size: 0.68rem;
      font-weight: 300;
      color: var(--muted);
    }

    @media (min-width: 900px) { .sticky { display: none; } .footer { padding-bottom: 2rem; } }

    /* ─────────── Consent banner ─────────── */

    .consent {
      position: fixed;
      left: 1rem; right: 1rem;
      bottom: 1rem;
      z-index: 60;
      max-width: 30rem;
      margin: 0 auto;
      padding: 1.1rem 1.15rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
    }

    .consent[hidden] { display: none; }
    .consent p { font-size: 0.78rem; font-weight: 300; color: rgba(255, 255, 255, 0.75); line-height: 1.55; }
    .consent a { color: var(--primary); text-decoration: none; }

    .consent-actions { display: flex; gap: 0.55rem; margin-top: 0.9rem; }

    .consent-btn {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border-radius: 0.65rem;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--foreground);
    }

    .consent-btn--accept { background: var(--foreground); color: var(--bg); border-color: var(--foreground); }

    /* ─────────── Reveal ─────────── */

    .reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.is-in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; } }

    /* ─────────── Tablet ─────────── */

    @media (min-width: 600px) and (max-width: 899px) {
      .features { grid-template-columns: repeat(2, 1fr); }
      .reviews { grid-template-columns: repeat(2, 1fr); }
      .anchor { grid-template-columns: repeat(3, 1fr); }
    }

    /* ─────────── Desktop ─────────── */

    @media (min-width: 900px) {
      .hero { padding: 4.5rem 0 4rem; }
      .hero-grid { grid-template-columns: 1.15fr 0.85fr; gap: 3.5rem; }
      .hero-shot { max-width: 320px; justify-self: end; }
      .section { padding: 5rem 0; }
      .split { grid-template-columns: 1fr 1fr; gap: 3.5rem; }
      .split--flip .shot { order: -1; }
      .features { grid-template-columns: repeat(3, 1fr); gap: 1rem; }
      .reviews { grid-template-columns: repeat(3, 1fr); }
      .anchor { grid-template-columns: repeat(3, 1fr); align-items: center; }
      .anchor-item--hl { padding: 1.6rem 1.25rem; }
    }
  </style>
</head>
<body>

  <!-- ════════════ TOPBAR ════════════ -->
  <header class="topbar">
    <div class="container topbar-inner">
      <img src="../logo-full.svg" alt="RaceMind" class="topbar-logo">
      <p class="topbar-trust" id="topbarTrust"></p>
    </div>
  </header>

  <!-- ════════════ HERO ════════════ -->
  <section class="hero">
    <div class="hero-glow hero-glow--orange"></div>
    <div class="hero-glow hero-glow--cyan"></div>
    <div class="container hero-grid">
      <div>
        <span class="hero-eyebrow" id="heroEyebrow"><span id="heroEyebrowText"></span></span>
        <h1 id="heroTitle"></h1>
        <p class="hero-sub" id="heroSub"></p>
        <p class="hero-scope" id="heroScope"></p>

        <div class="cta-block">
          <a href="#" class="cta" data-cta="hero" id="ctaHero">
            <svg class="cta-icon" id="ctaHeroIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"></svg>
            <span id="ctaHeroLabel"></span>
          </a>
          <a href="#" class="cta-alt" data-cta="hero-alt" id="ctaHeroAlt"></a>
          <p class="cta-reassure" id="ctaReassure"></p>
        </div>

        <div class="rating">
          <span class="rating-stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
          <span class="rating-text" id="ratingText"></span>
        </div>
      </div>

      <div class="hero-shot">
        <!-- No src here on purpose: the head script already started the fetch
             for this variant's shot. width/height keep the box reserved so
             nothing shifts when it lands. -->
        <!-- 320x667 matches the three dashboard exports (1004x2094); it only
             reserves space until the file lands, then the real ratio wins. -->
        <img id="heroImg" alt="" width="320" height="667" fetchpriority="high">
      </div>
    </div>
  </section>

  <!-- ════════════ COMPAT ════════════ -->
  <section class="compat">
    <div class="container">
      <p class="compat-label" id="compatLabel"></p>
      <div class="compat-logos">
        <!-- Real brand assets only where we have them. logo-garmin.svg,
             logo-polar.svg and logo-coros.svg are hand-drawn <text> stand-ins
             in system-ui, not the actual wordmarks — the .webp files are the
             real logos and all three carry alpha, so the monochrome filter

    function wireCta(btnId, iconId, labelId, altId) {
      var btn = document.getElementById(btnId);
      var icon = document.getElementById(iconId);
      var label = document.getElementById(labelId);

      var isLeadIOS = leadPlatform === 'ios';
      btn.href = isLeadIOS ? iosUrl() : playUrl();
      icon.innerHTML = '<path d="' + (isLeadIOS ? APPLE_ICON : PLAY_ICON) + '"/>';
      label.innerHTML = isLeadIOS ? t.ctaLabelIOS : t.ctaLabelAndroid;

      btn.addEventListener('click', function () {
        trackStoreClick(isLeadIOS ? 'ios' : 'android', btnId);
      });

      if (!altId) return;
      var alt = document.getElementById(altId);

      // On a detected phone the other store is noise — hide it. On desktop
      // we cannot know, so both stay reachable.
      if (isIOS || isAndroid) { alt.style.display = 'none'; return; }

      alt.href = isLeadIOS ? playUrl() : iosUrl();
      alt.innerHTML = isLeadIOS ? t.ctaAltAndroid : t.ctaAltIOS;
      alt.addEventListener('click', function () {
        trackStoreClick(isLeadIOS ? 'android' : 'ios', altId);
      });
    }

    wireCta('ctaHero', 'ctaHeroIcon', 'ctaHeroLabel', 'ctaHeroAlt');
    wireCta('ctaClose', 'ctaCloseIcon', 'ctaCloseLabel', 'ctaCloseAlt');
    wireCta('ctaSticky', 'ctaStickyIcon', 'ctaStickyLabel', null);

    set('ctaReassure', t.reassure);
    set('ctaCloseReassure', t.reassure);

    /* ══════════════════════════════════════════════════════════════
       ⑨  BEHAVIOUR
       ══════════════════════════════════════════════════════════════ */

    // Sticky bar: only once the hero CTA is off screen, so we never show
    // two competing buttons at the same time.
    var sticky = document.getElementById('sticky');
    var heroCta = document.getElementById('ctaHero');

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        sticky.classList.toggle('is-visible', !entries[0].isIntersecting);
      }, { rootMargin: '-80px 0px 0px 0px' }).observe(heroCta);

      var revealObserver = new IntersectionObserver(function (entries, obs) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          e.target.classList.add('is-in');
          obs.unobserve(e.target);
        });
      }, { threshold: 0.12 });

      [].forEach.call(document.querySelectorAll('.reveal'), function (el) {
        revealObserver.observe(el);
      });
    } else {
      sticky.classList.add('is-visible');
      [].forEach.call(document.querySelectorAll('.reveal'), function (el) {
        el.classList.add('is-in');
      });
    }

    /* ══════════════════════════════════════════════════════════════
       ⑩  CONSENT GATE
       ══════════════════════════════════════════════════════════════ */

    var consent = document.getElementById('consent');
    var stored = readConsent();

    if (stored === 'granted') {
      loadPixel();
    } else if (stored !== 'denied' && /^\d+$/.test(META_PIXEL_ID)) {
      consent.hidden = false;
      document.body.classList.add('consent-open');
    }

    function answerConsent(value) {
      writeConsent(value);
      consent.hidden = true;
      document.body.classList.remove('consent-open');
      if (value === 'granted') loadPixel();
    }

    document.getElementById('consentAccept').addEventListener('click', function () {
      answerConsent('granted');
    });

    document.getElementById('consentDecline').addEventListener('click', function () {
      answerConsent('denied');
    });

    // Art. 7 (3) GDPR: withdrawal must be as easy as giving consent. Once the
    // pixel script is on the page the only honest way back is to tell Meta to
    // stop, drop the stored answer and its cookies, and reload without
    // loading the script again.
    var reopen = document.getElementById('consentReopen');
    reopen.textContent = t.consentReopen;
    reopen.addEventListener('click', function (e) {
      e.preventDefault();
      if (window.fbq) { try { window.fbq('consent', 'revoke'); } catch (err) { /* ignore */ } }
      try { window.localStorage.removeItem(CONSENT_KEY); } catch (err) { /* ignore */ }
      dropPixelCookies();
      window.location.reload();
    });
  })();
  </script>
