<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaceMind</title>
  <meta name="description" content="Dein Coach f&uuml;r Triathlon und Laufen &ndash; von 5 km bis Langdistanz.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/fonts.css">
  <script>
    /* Ads send both platforms to the same page, so the markup ships iOS
       first. This only flags Android on <html>; the reorder and the
       primary/secondary swap are pure CSS below. Inline and in <head> on
       purpose — this page is self-contained, so an external file would cost
       a round-trip before the first paint. Mirrors /js/store-buttons.js,
       which index.html and index-en.html load. */
    (function () {
      var ua = navigator.userAgent || '';
      // iPadOS 13+ reports as Macintosh; the touch-point check separates a
      // real Mac (0) from an iPad pretending to be one.
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      // Desktop keeps the shipped order: the visitor's phone is unknown there.
      if (/Android/.test(ua) && !isIOS) {
        document.documentElement.classList.add('is-android');
      }
    })();
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #FF8A00;
      --primary-dark: #FF6B00;
      --secondary: #00D1FF;
      --bg: #050505;
      --surface: #111111;
      --card: #1A1C1E;
      --muted: #949494;
      --foreground: #FFFFFF;
      --radius: 1rem;
    }

    body {
      font-family: 'Lexend Deca', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--foreground);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      max-width: 420px;
      width: 100%;
      margin: 1.5rem;
      padding: 2rem 1.5rem;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.25rem;
    }

    .title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .description {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .friend-code {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      padding: 1rem;
      background: var(--surface);
      border-radius: var(--radius);
    }

    .hint {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--primary);
      line-height: 1.5;
      margin-bottom: 1.5rem;
      padding: 0 0.25rem;
    }

    .hint-fallback {
      display: none;
      font-size: 0.75rem;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 1rem;
      padding: 0 0.25rem;
    }

    .features {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .feature {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.8rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.4;
    }

    .feature-icon {
      flex-shrink: 0;
      width: 18px;
      text-align: center;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .feature strong {
      font-weight: 500;
      color: var(--foreground);
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin-bottom: 1.5rem;
    }

    .store-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    .store-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.875rem 1.5rem;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .store-btn:hover { opacity: 0.85; }

    .store-btn--ios {
      background: var(--foreground);
      color: var(--bg);
    }

    .store-btn--android {
      background: var(--surface);
      color: var(--foreground);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* `.is-android` on <html> (inline script in <head>) promotes Google Play
       to the primary button and moves it first. iOS needs no counterpart — it
       is the shipped default. */

    .is-android .store-btn--android {
      order: -2;
      background: var(--foreground);
      color: var(--bg);
      border: none;
    }

    .is-android .store-btn--ios {
      order: -1;
      background: var(--surface);
      color: var(--foreground);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .open-app-btn {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.5rem;
      margin-bottom: 0.75rem;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      background: var(--primary);
      color: var(--bg);
      transition: opacity 0.2s;
    }

    .open-app-btn:hover { opacity: 0.85; }

    .store-icon {
      width: 22px;
      height: 22px;
    }

    .footer-text {
      margin-top: 1.25rem;
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 300;
    }

    .footer-text a {
      color: var(--primary);
      text-decoration: none;
    }

    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .back-link:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <!-- Friend invite view (hidden by default) -->
  <div class="card" id="friendView" style="display: none;">
    <img src="/favicon.png" alt="RaceMind" class="logo">
    <h1 class="title"><span class="gradient-text">RaceMind</span></h1>
    <p class="description" id="description"></p>

    <div class="friend-code" id="friendCode"></div>
    <p class="hint" id="hint"></p>

    <div class="features">
      <div class="feature">
        <span class="feature-icon">&circlearrowright;</span>
        <span id="feature1"></span>
      </div>
      <div class="feature">
        <span class="feature-icon">&#x21C4;</span>
        <span id="feature2"></span>
      </div>
      <div class="feature">
        <span class="feature-icon">?</span>
        <span id="feature3"></span>
      </div>
    </div>

    <div class="divider"></div>

    <a id="openAppBtn" class="open-app-btn" href="#"></a>
    <p class="hint-fallback" id="igFallback"></p>

    <div class="store-buttons">
      <a href="https://apps.apple.com/app/race-mind/id6759935305" class="store-btn store-btn--ios">
        <svg class="store-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        App Store
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.racemind.app" class="store-btn store-btn--android">
        <svg class="store-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 0 1-.61-.92V2.734a1 1 0 0 1 .609-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.199l2.302 2.302a1 1 0 0 1 0 1.38l-2.302 2.302L15.197 12l2.501-2.492zM5.864 2.658L16.8 9.49l-2.302 2.302-8.634-8.634z"/></svg>
        Google Play
      </a>
    </div>

    <p class="footer-text">
      <a href="/">race-mind.com</a>
    </p>
  </div>

  <!-- Generic 404 view (hidden by default) -->
  <div class="card" id="notFoundView" style="display: none;">
    <img src="/favicon.png" alt="RaceMind" class="logo">
    <h1 class="title"><span class="gradient-text" id="notFoundTitle"></span></h1>
    <p class="description" id="notFoundText"></p>
    <a href="/" class="back-link" id="notFoundBack"></a>
  </div>

  <script>
    var isDE = (navigator.language || '').toLowerCase().startsWith('de');

    // Two distinct deep-link landing flavors share the same card layout but
    // different copy. /friend/<code> = befriend, /r/<code> = pure referral
    // bonus. The branch is decided by whichever path segment we find.
    var t = isDE ? {
      friend: {
        description: 'Dein Coach für Triathlon und Laufen – von 5 km bis Langdistanz. Neu bei RaceMind? Über diesen Link nutzt du die App 4 Wochen kostenlos.',
        feature1: '<strong>Plan, der zu deiner Woche passt:</strong> Der Wochenplaner fragt nach Zeit, festen Terminen und wie es dir geht. Läuft die Woche anders, plant RaceMind neu – ohne Nachholen.',
        feature2: '<strong>Zusammen trainieren:</strong> Seht eure Einheiten und Wochen als Stories – und bleibt gegenseitig dran.',
        feature3: '<strong>Frag deinen Coach:</strong> Brauche ich einen Neo? Bin ich auf Kurs? Kann ich heute Gas geben? Er kennt deinen Plan und deine Daten – und antwortet sofort.',
        hintWithName: 'Anscheinend hast du die App noch nicht installiert. Installiere RaceMind und klicke den Freunde-Link erneut, um {name} hinzuzufügen.',
        hintGeneric: 'Anscheinend hast du die App noch nicht installiert. Installiere RaceMind und klicke den Freunde-Link erneut, um deinen Freund oder deine Freundin hinzuzufügen.'
      },
      referral: {
        description: 'Du wurdest empfohlen — nutze RaceMind vier Wochen kostenlos.',
        feature1: '<strong>4 Wochen kostenlos</strong> — die volle App, kein Abo nötig.',
        feature2: '<strong>Dein Empfehlender</strong> bekommt einen Gratis-Monat, wenn du dabeibleibst.',
        hintWithName: 'Anscheinend hast du die App noch nicht installiert. Installiere RaceMind und klicke den Empfehlungs-Link erneut, um den Bonus von {name} zu aktivieren.',
        hintGeneric: 'Anscheinend hast du die App noch nicht installiert. Installiere RaceMind und klicke den Empfehlungs-Link erneut, um den Bonus zu aktivieren.'
      },
      openApp: 'App öffnen',
      copyCode: 'Code kopieren',
      codeCopied: 'Code kopiert ✓',
      copyFailed: 'Kopieren ging nicht – tippe den Code oben ab',
      igHintIOS: 'Instagram kann RaceMind nicht öffnen. Tippe oben rechts auf ••• und dann auf „In externem Browser öffnen“ – dort klappt „App öffnen“. Noch keine App? Installiere sie und öffne den Link danach noch einmal.',
      igHintAndroid: 'Instagram kann RaceMind nicht immer direkt öffnen. Tippe auf „App öffnen“. Noch keine App? Installiere sie und öffne den Link danach noch einmal.',
      igPasteCode: 'Oder füge den Code in RaceMind unter Einstellungen → Freunde ein.',
      igFallbackAndroid: 'Passiert nichts? Tippe oben rechts auf ⋮ und öffne die Seite im Browser.',
      igFallbackCode: 'Oder gib den Code oben in RaceMind unter Einstellungen → Freunde ein.',
      notFoundTitle: 'Seite nicht gefunden',
      notFoundText: 'Die Seite, die du suchst, existiert nicht.',
      notFoundBack: 'Zurück zu race-mind.com'
    } : {
      friend: {
        description: 'Your coach for triathlon and running – from 5K to full distance. New to RaceMind? With this link you get the app free for 4 weeks.',
        feature1: '<strong>A plan that fits your week:</strong> The weekly planner asks about your time, fixed appointments and how you feel. If the week changes, RaceMind replans – no catching up.',
        feature2: '<strong>Train together:</strong> See each other\'s sessions and weeks as stories – and keep each other going.',
        feature3: '<strong>Ask your coach:</strong> Do I need a wetsuit? Am I on track? Can I push today? It knows your plan and your data – and answers right away.',
        hintWithName: 'It looks like you don\'t have the app yet. Install RaceMind and tap the friend link again to add {name}.',
        hintGeneric: 'It looks like you don\'t have the app yet. Install RaceMind and tap the friend link again to add your friend.'
      },
      referral: {
        description: 'You were referred — use RaceMind free for four weeks.',
        feature1: '<strong>4 weeks free</strong> — the full app, no subscription needed.',
        feature2: '<strong>Your referrer</strong> gets a free month if you stick around.',
        hintWithName: 'It looks like you don\'t have the app yet. Install RaceMind and tap the referral link again to activate {name}\'s bonus.',
        hintGeneric: 'It looks like you don\'t have the app yet. Install RaceMind and tap the referral link again to activate the bonus.'
      },
      openApp: 'Open in app',
      copyCode: 'Copy code',
      codeCopied: 'Code copied ✓',
      copyFailed: 'Couldn\'t copy – type the code above',
      igHintIOS: 'Instagram can\'t open RaceMind. Tap ••• at the top right, then “Open in external browser” – “Open in app” works there. No app yet? Install it, then open the link again.',
      igHintAndroid: 'Instagram can\'t always open RaceMind directly. Tap “Open in app”. No app yet? Install it, then open the link again.',
      igPasteCode: 'Or paste the code in RaceMind under Settings → Friends.',
      igFallbackAndroid: 'Nothing happens? Tap ⋮ at the top right and open the page in your browser.',
      igFallbackCode: 'Or enter the code above in RaceMind under Settings → Friends.',
      notFoundTitle: 'Page not found',
      notFoundText: 'The page you\'re looking for doesn\'t exist.',
      notFoundBack: 'Back to race-mind.com'
    };

    document.documentElement.lang = isDE ? 'de' : 'en';

    // The async Clipboard API first; the textarea + execCommand path covers
    // web views that lack it or refuse the write.
    function copyText(text) {
      var legacy = function () {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'absolute';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (!ok) throw new Error('copy refused');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(legacy);
      }
      return new Promise(function (resolve) { legacy(); resolve(); });
    }

    var path = window.location.pathname;
    var parts = path.split('/').filter(Boolean);
    var friendIndex = parts.indexOf('friend');
    var rIndex = parts.indexOf('r');

    var subset = null;
    var code = '';
    var deepLinkSegment = '';
    if (friendIndex >= 0 && parts[friendIndex + 1]) {
      subset = t.friend;
      code = parts[friendIndex + 1];
      deepLinkSegment = 'friend';
    } else if (rIndex >= 0 && parts[rIndex + 1]) {
      subset = t.referral;
      code = parts[rIndex + 1];
      deepLinkSegment = 'r';
    }

    if (subset) {
      var display = code.replace(/(\d+)$/, '#$1');
      document.getElementById('friendCode').textContent = display;
      document.getElementById('friendView').style.display = '';

      document.getElementById('description').textContent = subset.description;
      document.getElementById('feature1').innerHTML = subset.feature1;
      document.getElementById('feature2').innerHTML = subset.feature2;
      // Feature 3 is friend-only (referral has 2 features). Hide the row when missing.
      var feature3El = document.getElementById('feature3');
      if (subset.feature3) {
        feature3El.innerHTML = subset.feature3;
      } else {
        feature3El.parentNode.style.display = 'none';
      }

      var hintEl = document.getElementById('hint');
      var name = code.replace(/\d+$/, '');
      var capitalName = name.charAt(0).toUpperCase() + name.slice(1);

      if (name) {
        hintEl.textContent = subset.hintWithName.replace('{name}', capitalName);
      } else {
        hintEl.textContent = subset.hintGeneric;
      }

      // "Open in app" escape hatch for users on a device that has the app
      // but where iOS hasn't refreshed the AASA cache yet (in-place update,
      // not a fresh install). Triple-slash so the path passed to
      // +native-intent.tsx starts with `/r/` or `/friend/` and matches the
      // existing path.includes() checks. Mobile UA only — desktop users would
      // get a "Cannot Open Page" dialog.
      var ua = navigator.userAgent || '';
      var isMobile = /iPhone|iPad|iPod|Android/i.test(ua);
      var isAndroid = /Android/i.test(ua);
      if (isMobile) {
        var openBtn = document.getElementById('openAppBtn');
        openBtn.href = 'racemind:///' + deepLinkSegment + '/' + encodeURIComponent(code);
        openBtn.textContent = t.openApp;
        openBtn.style.display = 'flex';
      }

      // Instagram opens links in its own web view, which neither hands a
      // universal/app link to the OS nor lets a `racemind://` link through:
      // the page loads although the app is installed, and the button above
      // does nothing. On iOS nothing leaves that web view — `x-safari-https://`
      // was tried and does nothing either (device test 09.10.2026) — so the
      // card names Instagram's own "open in external browser" menu item, where
      // the plain button works, and a friend link turns the button into "copy
      // code" for the app's friend field. Android gets an `intent://` URL,
      // which Chrome-based web views may resolve to the app (untested).
      if (isMobile && /Instagram/i.test(ua)) {
        var fallbackEl = document.getElementById('igFallback');
        if (isAndroid) {
          var playUrl = 'https://play.google.com/store/apps/details?id=com.racemind.app';
          openBtn.href = 'intent://' + deepLinkSegment + '/' + encodeURIComponent(code) +
            '#Intent;scheme=racemind;package=com.racemind.app;S.browser_fallback_url=' +
            encodeURIComponent(playUrl) + ';end';
          hintEl.textContent = t.igHintAndroid;
          fallbackEl.textContent = t.igFallbackAndroid +
            (deepLinkSegment === 'friend' ? ' ' + t.igFallbackCode : '');
          fallbackEl.style.display = 'block';
        } else {
          hintEl.textContent = t.igHintIOS;
          if (deepLinkSegment === 'friend') {
            openBtn.href = '#';
            openBtn.textContent = t.copyCode;
            openBtn.addEventListener('click', function (e) {
              e.preventDefault();
              copyText(display).then(function () {
                openBtn.textContent = t.codeCopied;
              }, function () {
                openBtn.textContent = t.copyFailed;
              });
            });
            fallbackEl.textContent = t.igPasteCode;
            fallbackEl.style.display = 'block';
          } else {
            openBtn.style.display = 'none';
          }
        }
      }
    } else {
      document.getElementById('notFoundView').style.display = '';
      document.getElementById('notFoundTitle').textContent = t.notFoundTitle;
      document.getElementById('notFoundText').textContent = t.notFoundText;
      document.getElementById('notFoundBack').textContent = t.notFoundBack;
    }
  </script>
</body>
</html>
