<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaceMind</title>
  <meta name="description" content="Dein Coach f&uuml;r Triathlon und Laufen &ndash; von 5 km bis Langdistanz.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/fonts.css">
  <script>
    /* Ads send both platforms to the same page, so the markup ships iOS
       first. This only flags Android on <html>; the reorder and the
       primary/secondary swap are pure CSS below. Inline and in <head> on
       purpose — this page is self-contained, so an external file would cost
       a round-trip before the first paint. Mirrors /js/store-buttons.js,
       which index.html and index-en.html load. */
    (function () {
      var ua = navigator.userAgent || '';
      // iPadOS 13+ reports as Macintosh; the touch-point check separates a
      // real Mac (0) from an iPad pretending to be one.
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      // Desktop keeps the shipped order: the visitor's phone is unknown there.
      if (/Android/.test(ua) && !isIOS) {
        document.documentElement.classList.add('is-android');
      }
    })();
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #FF8A00;
      --primary-dark: #FF6B00;
      --secondary: #00D1FF;
      --bg: #050505;
      --surface: #111111;
      --card: #1A1C1E;
      --muted: #949494;
      --foreground: #FFFFFF;
      --soft: rgba(255, 255, 255, 0.8);
      --line: rgba(255, 255, 255, 0.12);
      --voucher-edge: rgba(255, 138, 0, 0.35);
      --radius: 1rem;
    }

    body {
      font-family: 'Lexend Deca', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--foreground);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--secondary);
      outline-offset: 2px;
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Invite (/friend/<code>, /r/<code>) ───────────────────────── */

    .invite {
      max-width: 420px;
      margin: 0 auto;
      padding: 1.25rem 1rem 2rem;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
    }

    .inviter {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .avatar-ring {
      padding: 2px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      margin-bottom: 0.875rem;
    }

    .avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 999px;
      background: var(--card);
      font-size: 1.55rem;
      font-weight: 700;
      overflow: hidden;
    }

    .avatar img {
      width: 40px;
      height: 40px;
      border-radius: 9px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 0.5rem;
      text-wrap: balance;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 300;
      line-height: 1.5;
      text-wrap: balance;
    }

    .voucher {
      position: relative;
      margin-bottom: 1.25rem;
      background: var(--card);
      border: 1px solid var(--voucher-edge);
      border-radius: 1.25rem;
    }

    .voucher-main {
      padding: 1.375rem 1.25rem 1.25rem;
    }

    .eyebrow {
      margin-bottom: 0.625rem;
      color: var(--primary);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .days {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      margin-bottom: 1.25rem;
    }

    .days-number {
      font-size: 3.75rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .days-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .days-unit {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .days-free {
      color: var(--soft);
      font-size: 0.875rem;
      font-weight: 300;
    }

    .perks {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .perks li {
      display: flex;
      align-items: flex-start;
      gap: 0.625rem;
      color: var(--soft);
      font-size: 0.85rem;
      font-weight: 300;
      line-height: 1.4;
    }

    .perks svg {
      flex-shrink: 0;
      margin-top: 1px;
    }

    .perks strong, .steps strong {
      font-weight: 500;
      color: var(--foreground);
    }

    /* The tear-off line with a half notch on either edge of the voucher. */
    .perforation {
      position: relative;
      height: 0;
      margin: 0 18px;
      border-top: 2px dashed var(--line);
    }

    .perforation::before, .perforation::after {
      content: '';
      position: absolute;
      top: -13px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--bg);
    }

    .perforation::before { left: -31px; border-right-color: var(--voucher-edge); }
    .perforation::after { right: -31px; border-left-color: var(--voucher-edge); }

    .voucher-stub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 1rem 1rem 1rem 1.25rem;
    }

    .stub-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .stub-label {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stub-code {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      overflow-wrap: anywhere;
    }

    .copy-btn {
      flex-shrink: 0;
      min-height: 44px;
      max-width: 55%;
      padding: 0.5rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--foreground);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .store-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      margin-bottom: 1.75rem;
    }

    .store-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: var(--radius);
      font-family: inherit;
      text-decoration: none;
      text-align: center;
      transition: opacity 0.2s;
    }

    .store-btn:hover { opacity: 0.85; }

    .store-btn svg { flex-shrink: 0; }

    .store-btn--primary {
      min-height: 54px;
      padding: 0.875rem 1.25rem;
      background: var(--primary);
      color: var(--bg);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .store-btn--secondary {
      min-height: 48px;
      padding: 0.75rem 1.25rem;
      border: 1px solid var(--line);
      color: var(--foreground);
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* `.is-android` on <html> (inline script in <head>) moves Google Play
       first; the script below gives it the primary look and label. */
    .is-android .store-btn--play { order: -1; }

    .steps-title {
      margin-bottom: 0.875rem;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .steps {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .steps li {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .step-num {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .steps li:last-child .step-num {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--bg);
      font-weight: 700;
    }

    .steps p {
      margin-top: 3px;
      color: var(--soft);
      font-size: 0.85rem;
      font-weight: 300;
      line-height: 1.45;
    }

    .fineprint {
      margin-bottom: 1.25rem;
      padding: 0.875rem 1rem;
      border-radius: 14px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 300;
      line-height: 1.55;
    }

    .installed {
      display: none;
      margin-bottom: 0.5rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 300;
      line-height: 1.5;
      text-align: center;
    }

    .open-app-link {
      display: none;
      margin-bottom: 0.5rem;
      color: var(--primary);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      text-align: center;
    }

    .footer-text {
      margin-top: 1rem;
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 300;
      text-align: center;
    }

    .footer-text a {
      color: var(--primary);
      text-decoration: none;
    }

    /* ── Not found ───────────────────────────────────────────────── */

    .not-found {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      max-width: 420px;
      width: 100%;
      margin: 1.5rem;
      padding: 2rem 1.5rem;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.25rem;
    }

    .card .title {
      font-size: 1.35rem;
      margin-bottom: 0.75rem;
    }

    .description {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .back-link:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <!-- Invite view: /friend/<code> and /r/<code> (hidden by default) -->
  <main class="invite" id="friendView" style="display: none;">
    <header class="brand">
      <img src="/favicon.png" alt="" class="brand-logo">
      <span>RaceMind</span>
    </header>

    <div class="inviter">
      <div class="avatar-ring"><div class="avatar" id="avatar"></div></div>
      <h1 class="title" id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
    </div>

    <section class="voucher" aria-labelledby="eyebrow">
      <div class="voucher-main">
        <p class="eyebrow" id="eyebrow"></p>
        <div class="days">
          <span class="days-number gradient-text">28</span>
          <div class="days-text">
            <span class="days-unit" id="daysUnit"></span>
            <span class="days-free" id="daysFree"></span>
          </div>
        </div>
        <ul class="perks" id="perks"></ul>
      </div>
      <div class="perforation" aria-hidden="true"></div>
      <div class="voucher-stub">
        <div class="stub-text">
          <span class="stub-label" id="codeLabel"></span>
          <span class="stub-code" id="friendCode"></span>
        </div>
        <button type="button" class="copy-btn" id="copyBtn"></button>
      </div>
    </section>

    <div class="store-buttons">
      <a id="appStoreBtn" class="store-btn store-btn--app" href="https://apps.apple.com/app/race-mind/id6759935305"></a>
      <a id="playBtn" class="store-btn store-btn--play" href="https://play.google.com/store/apps/details?id=com.racemind.app"></a>
    </div>

    <h2 class="steps-title" id="stepsTitle"></h2>
    <ol class="steps" id="steps"></ol>

    <p class="fineprint" id="fineprint"></p>

    <p class="installed" id="igNote"></p>
    <a class="open-app-link" id="openAppLink" href="#"></a>
    <p class="installed" id="igFallback"></p>

    <p class="footer-text">
      <a href="/">race-mind.com</a>
    </p>
  </main>

  <!-- Generic 404 view (hidden by default) -->
  <div class="not-found" id="notFoundView" style="display: none;">
    <div class="card">
      <img src="/favicon.png" alt="RaceMind" class="logo">
      <h1 class="title"><span class="gradient-text" id="notFoundTitle"></span></h1>
      <p class="description" id="notFoundText"></p>
      <a href="/" class="back-link" id="notFoundBack"></a>
    </div>
  </div>

  <script>
    var isDE = (navigator.language || '').toLowerCase().startsWith('de');

    // Two link flavours share one page. /friend/<code> makes friends with the
    // code's owner; /r/<code> only refers, without a friendship. The steps
    // hold for every app version: since 14.10.2026 a code makes friends at
    // once, older apps still send a request (until the OTA on 1.9.2), so they
    // promise the four weeks, not when the friendship starts.
    // Each line below is [bold lead, rest].
    var t = isDE ? {
      friend: {
        title: '{name} lädt dich zu RaceMind ein',
        titleGeneric: 'Du bist zu RaceMind eingeladen',
        step2: ['Diesen Link noch einmal öffnen,', ' dann laufen deine 4 Wochen ab der Einrichtung.'],

      },

        step2: ['Diesen Link noch einmal öffnen,', ' sobald die App installiert ist. Deine 4 Wochen zählen ab der Einrichtung.'],
        step3: ['Oder den Code eingeben:', ' in den Einstellungen unter „Referral- oder Freundescode einlösen“, bis 14 Tage nach dem Start.']
      },
      subtitle: 'Dein Coach für Triathlon und Laufen, von 5 km bis Langdistanz.',
      eyebrow: 'Deine Einladung',
      daysUnit: 'Tage Premium',
      daysFree: 'kostenlos testen',
      perks: [
        ['Coach-Chat,', ' der deinen Plan und deine Daten kennt'],
        ['Wochenplaner,', ' der neu plant, wenn die Woche anders läuft'],
        ['Analyse', ' jeder Einheit durch den Coach']
      ],
      codeLabel: 'Dein Code',
      copy: 'Kopieren',
      copied: 'Kopiert ✓',
      copyFailed: 'Kopieren ging nicht – tippe den Code ab',
      primary: 'App laden und 4 Wochen sichern',
      secondaryPlay: 'Android? Bei Google Play laden',
      secondaryAppStore: 'iPhone? Im App Store laden',
      stepsTitle: 'So geht’s',
      step1: ['App laden,', ' kostenlos im App Store oder bei Google Play.'],
      fineprint: 'Für alle, die neu bei RaceMind sind. Kein Abo und keine Zahlungsdaten nötig. Die Testphase endet nach 4 Wochen von selbst. Plan, Aktivitäten und Freunde bleiben danach kostenlos.',
      openApp: 'Schon installiert? App öffnen',
      igIOS: 'Schon installiert? Tippe oben rechts auf ••• und dann auf „In externem Browser öffnen“. Dort kannst du die App öffnen.',
      igAndroidFallback: 'Passiert nichts? Tippe oben rechts auf ⋮ und öffne die Seite im Browser.',
      notFoundTitle: 'Seite nicht gefunden',
      notFoundText: 'Die Seite, die du suchst, existiert nicht.',
      notFoundBack: 'Zurück zu race-mind.com'
    } : {
      friend: {
        title: '{name} invited you to RaceMind',
        titleGeneric: 'You’re invited to RaceMind',
        step2: ['Open this link again,', ' and your 4 weeks run from setup.'],
        step3: ['Or enter the code:', ' under Settings → Friends, within 14 days of starting.']
      },
      referral: {
        title: '{name} recommends RaceMind',
        titleGeneric: 'RaceMind was recommended to you',
        step2: ['Open this link again', ' once the app is installed. Your 4 weeks count from setup.'],
        step3: ['Or enter the code:', ' in Settings under “Redeem referral or friend code”, within 14 days of starting.']
      },
      subtitle: 'Your coach for triathlon and running, from 5K to full distance.',
      eyebrow: 'Your invite',
      daysUnit: 'days of Premium',
      daysFree: 'free to try',
      perks: [
        ['Coach chat', ' that knows your plan and your data'],
        ['Weekly planner', ' that replans when your week changes'],
        ['Every session', ' analysed by your coach']
      ],
      codeLabel: 'Your code',
      copy: 'Copy',
      copied: 'Copied ✓',
      copyFailed: 'Couldn’t copy – type the code',
      primary: 'Get the app and your 4 weeks',
      secondaryPlay: 'Android? Get it on Google Play',
      secondaryAppStore: 'iPhone? Get it on the App Store',
      stepsTitle: 'How it works',
      step1: ['Get the app,', ' free on the App Store or Google Play.'],
      fineprint: 'For anyone new to RaceMind. No subscription, no payment details. The trial ends on its own after 4 weeks. Your plan, activities and friends stay free afterwards.',
      openApp: 'Already installed? Open the app',
      igIOS: 'Already installed? Tap ••• at the top right, then “Open in external browser”. You can open the app from there.',
      igAndroidFallback: 'Nothing happens? Tap ⋮ at the top right and open the page in your browser.',
      notFoundTitle: 'Page not found',
      notFoundText: 'The page you’re looking for doesn’t exist.',
      notFoundBack: 'Back to race-mind.com'
    };

    document.documentElement.lang = isDE ? 'de' : 'en';

    var APPLE_ICON = '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>';
    var PLAY_ICON = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 0 1-.61-.92V2.734a1 1 0 0 1 .609-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.199l2.302 2.302a1 1 0 0 1 0 1.38l-2.302 2.302L15.197 12l2.501-2.492zM5.864 2.658L16.8 9.49l-2.302 2.302-8.634-8.634z"/></svg>';
    var CHECK_ICON = '<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF8A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

    // The async Clipboard API first; the textarea + execCommand path covers
    // web views that lack it or refuse the write.
    function copyText(text) {
      var legacy = function () {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'absolute';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (!ok) throw new Error('copy refused');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(legacy);
      }
      return new Promise(function (resolve) { legacy(); resolve(); });
    }

    // A bold lead and the rest as text nodes, never innerHTML: the page
    // carries a name taken from the URL.
    function richLine(el, pair) {
      var strong = document.createElement('strong');
      strong.textContent = pair[0];
      el.appendChild(strong);
      el.appendChild(document.createTextNode(pair[1]));
    }

    function addStep(list, number, pair) {
      var li = document.createElement('li');
      var num = document.createElement('span');
      num.className = 'step-num';
      num.textContent = String(number);
      var p = document.createElement('p');
      richLine(p, pair);
      li.appendChild(num);
      li.appendChild(p);
      list.appendChild(li);
    }

    var path = window.location.pathname;
    var parts = path.split('/').filter(Boolean);
    var friendIndex = parts.indexOf('friend');
    var rIndex = parts.indexOf('r');

    var subset = null;
    var code = '';
    var deepLinkSegment = '';
    if (friendIndex >= 0 && parts[friendIndex + 1]) {
      subset = t.friend;
      code = parts[friendIndex + 1];
      deepLinkSegment = 'friend';
    } else if (rIndex >= 0 && parts[rIndex + 1]) {
      subset = t.referral;
      code = parts[rIndex + 1];
      deepLinkSegment = 'r';
    }

    if (subset) {
      var display = code.replace(/(\d+)$/, '#$1');
      var name = code.replace(/\d+$/, '');
      var capitalName = name ? name.charAt(0).toUpperCase() + name.slice(1) : '';

      document.getElementById('friendView').style.display = '';

      // Who invites: their initial, or the logo when the code carries no name.
      var avatar = document.getElementById('avatar');
      if (capitalName) {
        avatar.textContent = capitalName.charAt(0);
      } else {
        var logo = document.createElement('img');
        logo.src = '/favicon.png';
        logo.alt = '';
        avatar.appendChild(logo);
      }
      document.getElementById('title').textContent = capitalName
        ? subset.title.replace('{name}', capitalName)
        : subset.titleGeneric;
      document.getElementById('subtitle').textContent = t.subtitle;

      document.getElementById('eyebrow').textContent = t.eyebrow;
      document.getElementById('daysUnit').textContent = t.daysUnit;
      document.getElementById('daysFree').textContent = t.daysFree;
      var perks = document.getElementById('perks');
      t.perks.forEach(function (pair) {
        var li = document.createElement('li');
        li.innerHTML = CHECK_ICON;
        var span = document.createElement('span');
        richLine(span, pair);
        li.appendChild(span);
        perks.appendChild(li);
      });

      document.getElementById('codeLabel').textContent = t.codeLabel;
      document.getElementById('friendCode').textContent = display;
      var copyBtn = document.getElementById('copyBtn');
      copyBtn.textContent = t.copy;
      copyBtn.addEventListener('click', function () {
        copyText(display).then(function () {
          copyBtn.textContent = t.copied;
        }, function () {
          copyBtn.textContent = t.copyFailed;
        });
      });

      // The phone's own store is the orange button; the other one sits under
      // it. Desktop keeps the App Store first, as the rest of the site does.
      var isAndroidUA = document.documentElement.classList.contains('is-android');
      var appStoreBtn = document.getElementById('appStoreBtn');
      var playBtn = document.getElementById('playBtn');
      var primaryBtn = isAndroidUA ? playBtn : appStoreBtn;
      var secondaryBtn = isAndroidUA ? appStoreBtn : playBtn;
      primaryBtn.classList.add('store-btn--primary');
      primaryBtn.innerHTML = isAndroidUA ? PLAY_ICON : APPLE_ICON;
      primaryBtn.appendChild(document.createTextNode(t.primary));
      secondaryBtn.classList.add('store-btn--secondary');
      secondaryBtn.innerHTML = isAndroidUA ? APPLE_ICON : PLAY_ICON;
      secondaryBtn.appendChild(document.createTextNode(isAndroidUA ? t.secondaryAppStore : t.secondaryPlay));

      document.getElementById('stepsTitle').textContent = t.stepsTitle;
      var steps = document.getElementById('steps');
      addStep(steps, 1, t.step1);
      addStep(steps, 2, subset.step2);
      addStep(steps, 3, subset.step3);

      document.getElementById('fineprint').textContent = t.fineprint;

      // "Already installed?" for visitors who have the app but whose phone
      // showed this page anyway (iOS had not refreshed the AASA cache after an
      // in-place update). Triple-slash so the path passed to
      // +native-intent.tsx starts with `/r/` or `/friend/`. Mobile only —
      // desktop would get a "Cannot Open Page" dialog.
      var ua = navigator.userAgent || '';
      var isMobile = /iPhone|iPad|iPod|Android/i.test(ua);
      var isAndroid = /Android/i.test(ua);
      var openLink = document.getElementById('openAppLink');
      var igNote = document.getElementById('igNote');
      var igFallback = document.getElementById('igFallback');
      if (isMobile) {
        openLink.href = 'racemind:///' + deepLinkSegment + '/' + encodeURIComponent(code);
        openLink.textContent = t.openApp;
        openLink.style.display = 'block';
      }

      // Instagram opens links in its own web view, which neither hands a
      // universal/app link to the OS nor lets a `racemind://` link through.
      // On iOS nothing leaves that web view — `x-safari-https://` does nothing
      // either (device test 09.10.2026) — so the page names Instagram's own
      // "open in external browser" menu item; the code above stays the way
      // in without a browser. Android gets an `intent://` URL, which
      // Chrome-based web views may resolve to the app (untested).
      if (isMobile && /Instagram/i.test(ua)) {
        if (isAndroid) {
          var playUrl = 'https://play.google.com/store/apps/details?id=com.racemind.app';
          openLink.href = 'intent://' + deepLinkSegment + '/' + encodeURIComponent(code) +
            '#Intent;scheme=racemind;package=com.racemind.app;S.browser_fallback_url=' +
            encodeURIComponent(playUrl) + ';end';
          igFallback.textContent = t.igAndroidFallback;
          igFallback.style.display = 'block';
        } else {
          openLink.style.display = 'none';
          igNote.textContent = t.igIOS;
          igNote.style.display = 'block';
        }
      }
    } else {
      document.getElementById('notFoundView').style.display = '';
      document.getElementById('notFoundTitle').textContent = t.notFoundTitle;
      document.getElementById('notFoundText').textContent = t.notFoundText;
      document.getElementById('notFoundBack').textContent = t.notFoundBack;
    }
  </script>
</body>
</html>
