<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaceMind</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://race-mind.com/">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script>
    /* A link from the app always carries its code: /r/<code> has no file
       of its own, so GitHub Pages serves it with 404.html, the invitation
       page. This folder only answers /r/ without a code (typed by hand,
       cut off while copying), which invites to nothing - so it forwards to
       the start page in the visitor's language. A ?code= query, the form the
       old page also read, goes on to the invitation page. */
    (function () {
      var code = new URLSearchParams(window.location.search).get('code');
      if (code) {
        window.location.replace('/r/' + encodeURIComponent(code));
        return;
      }
      var isDE = (navigator.language || '').toLowerCase().startsWith('de');
      window.location.replace(isDE ? '/' : '/index-en.html');
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body>
  <noscript><a href="/">race-mind.com</a></noscript>
</body>
</html>
